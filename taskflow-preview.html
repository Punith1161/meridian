<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TaskFlow — Preview</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #0f0f11;
    --surface: #17171a;
    --surface2: #1e1e22;
    --surface3: #26262c;
    --border: #2e2e36;
    --border2: #3a3a44;
    --text: #f0f0f2;
    --text2: #9090a0;
    --text3: #5a5a6a;
    --accent: #7c6dfa;
    --accent-soft: #7c6dfa22;
    --green: #3ecf8e;
    --green-soft: #3ecf8e18;
    --amber: #f5a623;
    --amber-soft: #f5a62318;
    --red: #f06070;
    --red-soft: #f0607018;
    --blue: #4ea8de;
    --blue-soft: #4ea8de18;
    --radius: 10px;
    --radius-sm: 6px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; overflow: hidden; font-size: 14px; }

  /* SIDEBAR */
  .sidebar {
    width: 56px; background: var(--surface); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; align-items: center; padding: 16px 0; gap: 4px;
    flex-shrink: 0; z-index: 10;
  }
  .logo { width: 32px; height: 32px; background: var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; flex-shrink: 0; }
  .logo svg { width: 16px; height: 16px; fill: #fff; }
  .nav-btn {
    width: 40px; height: 40px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--text3); transition: all 0.15s; border: none; background: none; position: relative;
  }
  .nav-btn:hover { background: var(--surface2); color: var(--text2); }
  .nav-btn.active { background: var(--accent-soft); color: var(--accent); }
  .nav-btn svg { width: 18px; height: 18px; }
  .nav-spacer { flex: 1; }

  /* MAIN */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .topbar {
    padding: 0 24px; height: 56px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
    background: var(--surface);
  }
  .topbar-left { display: flex; align-items: center; gap: 12px; }
  .page-title { font-size: 15px; font-weight: 600; color: var(--text); }
  .topbar-right { display: flex; align-items: center; gap: 8px; }
  .btn {
    padding: 6px 14px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 500;
    cursor: pointer; border: 1px solid var(--border2); background: var(--surface2);
    color: var(--text2); font-family: 'DM Sans', sans-serif; transition: all 0.15s; display: flex; align-items: center; gap: 6px;
  }
  .btn:hover { background: var(--surface3); color: var(--text); border-color: var(--border2); }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn.primary:hover { opacity: 0.88; }
  .btn svg { width: 14px; height: 14px; }

  /* VIEWS */
  .view { display: none; flex: 1; overflow: hidden; }
  .view.active { display: flex; }

  /* KANBAN */
  .kanban-wrap { flex: 1; padding: 20px 24px; overflow-x: auto; display: flex; gap: 14px; align-items: flex-start; }
  .col { width: 270px; flex-shrink: 0; display: flex; flex-direction: column; gap: 8px; }
  .col-head { display: flex; align-items: center; justify-content: space-between; padding: 0 2px 10px; }
  .col-label { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text3); }
  .col-dot { width: 7px; height: 7px; border-radius: 50%; }
  .col-count { font-size: 11px; background: var(--surface2); color: var(--text3); padding: 1px 7px; border-radius: 10px; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 12px 14px; cursor: pointer; transition: border-color 0.15s, transform 0.1s;
  }
  .card:hover { border-color: var(--border2); transform: translateY(-1px); }
  .card-title { font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 10px; line-height: 1.4; }
  .card-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .badge { font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 4px; }
  .badge.high { background: var(--red-soft); color: var(--red); }
  .badge.med  { background: var(--amber-soft); color: var(--amber); }
  .badge.low  { background: var(--green-soft); color: var(--green); }
  .badge.done-b { background: var(--accent-soft); color: var(--accent); }
  .due { font-size: 11px; color: var(--text3); display: flex; align-items: center; gap: 4px; }
  .due svg { width: 11px; height: 11px; }
  .progress-wrap { margin-bottom: 10px; }
  .progress-track { height: 3px; background: var(--surface3); border-radius: 2px; }
  .progress-fill { height: 100%; border-radius: 2px; background: var(--accent); transition: width 0.3s; }
  .timer-row { display: flex; align-items: center; justify-content: space-between; }
  .timer-val { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text3); }
  .timer-play {
    width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--border2);
    background: var(--surface2); display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.15s; color: var(--text3);
  }
  .timer-play:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .timer-play.running { border-color: var(--green); color: var(--green); background: var(--green-soft); }
  .timer-play svg { width: 10px; height: 10px; }
  .empty-col { border: 1px dashed var(--border); border-radius: var(--radius); padding: 24px 16px; text-align: center; font-size: 12px; color: var(--text3); }

  /* TODAY VIEW */
  .today-wrap { flex: 1; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; max-width: 720px; }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
  .stat-label { font-size: 11px; color: var(--text3); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em; }
  .stat-val { font-size: 26px; font-weight: 600; color: var(--text); font-family: 'DM Mono', monospace; }
  .stat-sub { font-size: 11px; color: var(--text3); margin-top: 3px; }
  .section-head { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text3); margin-bottom: 10px; }
  .today-task { display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 6px; }
  .today-task-check { width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid var(--border2); flex-shrink: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .today-task-check.checked { background: var(--green); border-color: var(--green); }
  .today-task-check svg { width: 10px; height: 10px; color: #fff; }
  .today-task-title { flex: 1; font-size: 13px; color: var(--text); }
  .today-task-title.done-t { color: var(--text3); text-decoration: line-through; }
  .today-task-time { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text3); }

  /* ALL TASKS */
  .tasks-wrap { flex: 1; padding: 20px 24px; overflow-y: auto; }
  .tasks-table { width: 100%; border-collapse: collapse; }
  .tasks-table th { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.05em; padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--border); font-weight: 500; }
  .tasks-table td { padding: 11px 12px; border-bottom: 1px solid var(--border); font-size: 13px; color: var(--text2); vertical-align: middle; }
  .tasks-table tr:hover td { background: var(--surface2); }
  .tasks-table td:first-child { color: var(--text); font-weight: 500; }
  .status-pill { font-size: 11px; padding: 3px 9px; border-radius: 20px; font-weight: 500; }
  .status-todo { background: var(--surface3); color: var(--text3); }
  .status-inprog { background: var(--blue-soft); color: var(--blue); }
  .status-done { background: var(--green-soft); color: var(--green); }

  /* NOTES VIEW */
  .notes-layout { flex: 1; display: flex; overflow: hidden; }
  .notes-sidebar { width: 220px; border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0; }
  .notes-sidebar-head { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .notes-sidebar-title { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text3); }
  .notes-list { overflow-y: auto; flex: 1; padding: 8px; }
  .note-item { padding: 9px 10px; border-radius: var(--radius-sm); cursor: pointer; transition: background 0.1s; }
  .note-item:hover { background: var(--surface2); }
  .note-item.active { background: var(--accent-soft); }
  .note-item-title { font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 2px; }
  .note-item.active .note-item-title { color: var(--accent); }
  .note-item-date { font-size: 11px; color: var(--text3); }
  .note-editor { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .note-editor-head { padding: 16px 24px; border-bottom: 1px solid var(--border); }
  .note-editor-title { font-size: 18px; font-weight: 600; color: var(--text); background: none; border: none; outline: none; width: 100%; font-family: 'DM Sans', sans-serif; }
  .note-editor-title::placeholder { color: var(--text3); }
  .note-editor-body { flex: 1; padding: 20px 24px; overflow-y: auto; }
  .note-content { font-size: 14px; color: var(--text2); line-height: 1.8; outline: none; min-height: 200px; }
  .note-content h2 { font-size: 16px; color: var(--text); margin-bottom: 8px; margin-top: 20px; }
  .note-content p { margin-bottom: 12px; }
  .note-content ul { padding-left: 20px; margin-bottom: 12px; }
  .note-content li { margin-bottom: 4px; }
  .note-content code { background: var(--surface3); padding: 2px 6px; border-radius: 4px; font-family: 'DM Mono', monospace; font-size: 12px; color: var(--accent); }
  .md-toolbar { display: flex; gap: 4px; padding: 8px 24px; border-bottom: 1px solid var(--border); }
  .md-btn { padding: 4px 8px; border-radius: 4px; background: none; border: none; color: var(--text3); cursor: pointer; font-size: 12px; font-family: 'DM Mono', monospace; font-weight: 500; transition: all 0.1s; }
  .md-btn:hover { background: var(--surface2); color: var(--text); }

  /* SHEETS VIEW */
  .sheets-layout { flex: 1; display: flex; overflow: hidden; }
  .sheets-sidebar { width: 200px; border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0; }
  .sheets-sidebar-head { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .sheets-list { overflow-y: auto; flex: 1; padding: 8px; }
  .sheet-item { padding: 9px 10px; border-radius: var(--radius-sm); cursor: pointer; transition: background 0.1s; display: flex; align-items: center; gap: 8px; }
  .sheet-item:hover { background: var(--surface2); }
  .sheet-item.active { background: var(--green-soft); }
  .sheet-item svg { width: 14px; height: 14px; color: var(--text3); flex-shrink: 0; }
  .sheet-item.active svg { color: var(--green); }
  .sheet-item-name { font-size: 13px; color: var(--text); }
  .sheet-item.active .sheet-item-name { color: var(--green); font-weight: 500; }
  .sheet-main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .sheet-toolbar { padding: 8px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
  .sheet-name-input { background: none; border: none; outline: none; font-size: 14px; font-weight: 600; color: var(--text); font-family: 'DM Sans', sans-serif; flex: 1; }
  .sheet-wrap { flex: 1; overflow: auto; padding: 0; }
  .grid-table { border-collapse: collapse; min-width: 100%; }
  .grid-table th { background: var(--surface2); color: var(--text3); font-size: 11px; font-weight: 500; padding: 6px 12px; border: 1px solid var(--border); text-align: center; position: sticky; top: 0; z-index: 1; min-width: 40px; }
  .grid-table td { border: 1px solid var(--border); padding: 0; min-width: 100px; height: 32px; }
  .grid-table td:first-child { background: var(--surface2); color: var(--text3); font-size: 11px; text-align: center; padding: 0 8px; min-width: 40px; width: 40px; }
  .cell-input { width: 100%; height: 100%; background: none; border: none; outline: none; padding: 6px 10px; font-size: 13px; color: var(--text); font-family: 'DM Sans', sans-serif; }
  .cell-input:focus { background: var(--accent-soft); }
  .grid-table tr:hover td:not(:first-child) { background: var(--surface2); }
  .grid-table tr td:first-child { position: sticky; left: 0; }

  /* MODAL */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100; align-items: center; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--surface); border: 1px solid var(--border2); border-radius: 14px; padding: 24px; width: 400px; }
  .modal-title { font-size: 16px; font-weight: 600; margin-bottom: 18px; }
  .field { margin-bottom: 14px; }
  .field label { font-size: 12px; color: var(--text3); display: block; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.04em; }
  .field input, .field select, .field textarea {
    width: 100%; background: var(--surface2); border: 1px solid var(--border2); border-radius: var(--radius-sm);
    padding: 8px 12px; font-size: 13px; color: var(--text); font-family: 'DM Sans', sans-serif; outline: none;
  }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
  .field select option { background: var(--surface2); }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }

  /* TOAST */
  .toast { position: fixed; bottom: 24px; right: 24px; background: var(--surface2); border: 1px solid var(--border2); border-radius: var(--radius); padding: 10px 16px; font-size: 13px; color: var(--text); z-index: 200; opacity: 0; transform: translateY(8px); transition: all 0.2s; pointer-events: none; }
  .toast.show { opacity: 1; transform: translateY(0); }

  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 10px; }
</style>
</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <div class="logo">
    <svg viewBox="0 0 16 16"><path d="M2 2h5v5H2zM9 2h5v5H9zM2 9h5v5H2zM9 9h5v5H9z" opacity=".9"/></svg>
  </div>
  <button class="nav-btn active" onclick="switchView('kanban')" title="Kanban">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="5" height="18" rx="1"/><rect x="10" y="3" width="5" height="12" rx="1"/><rect x="17" y="3" width="5" height="15" rx="1"/></svg>
  </button>
  <button class="nav-btn" onclick="switchView('today')" title="Today">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
  </button>
  <button class="nav-btn" onclick="switchView('alltasks')" title="All Tasks">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4" cy="6" r="1.5"/><circle cx="4" cy="12" r="1.5"/><circle cx="4" cy="18" r="1.5"/></svg>
  </button>
  <button class="nav-btn" onclick="switchView('notes')" title="Notes">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 3 14 8 19 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/></svg>
  </button>
  <button class="nav-btn" onclick="switchView('sheets')" title="Sheets">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>
  </button>
  <div class="nav-spacer"></div>
  <button class="nav-btn" title="Settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
  </button>
</div>

<!-- MAIN -->
<div class="main">

  <!-- TOPBAR -->
  <div class="topbar">
    <div class="topbar-left">
      <span class="page-title" id="page-title">Kanban</span>
    </div>
    <div class="topbar-right" id="topbar-actions">
      <button class="btn primary" onclick="openModal()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
        New task
      </button>
    </div>
  </div>

  <!-- KANBAN VIEW -->
  <div class="view active" id="view-kanban" style="overflow:hidden;">
    <div class="kanban-wrap" id="kanban-board"></div>
  </div>

  <!-- TODAY VIEW -->
  <div class="view" id="view-today" style="overflow-y:auto;">
    <div class="today-wrap">
      <div class="stat-grid">
        <div class="stat-card">
          <div class="stat-label">Tasks today</div>
          <div class="stat-val" id="stat-total">0</div>
          <div class="stat-sub">assigned for today</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Completed</div>
          <div class="stat-val" id="stat-done" style="color:var(--green)">0</div>
          <div class="stat-sub">done today</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Time tracked</div>
          <div class="stat-val" id="stat-time" style="color:var(--accent)">0h 0m</div>
          <div class="stat-sub">across all tasks</div>
        </div>
      </div>
      <div>
        <div class="section-head">Today's tasks</div>
        <div id="today-list"></div>
      </div>
    </div>
  </div>

  <!-- ALL TASKS VIEW -->
  <div class="view" id="view-alltasks" style="overflow:hidden;">
    <div class="tasks-wrap">
      <table class="tasks-table">
        <thead>
          <tr>
            <th>Title</th><th>Priority</th><th>Status</th><th>Due</th><th>Estimate</th><th>Time spent</th>
          </tr>
        </thead>
        <tbody id="tasks-tbody"></tbody>
      </table>
    </div>
  </div>

  <!-- NOTES VIEW -->
  <div class="view" id="view-notes">
    <div class="notes-layout">
      <div class="notes-sidebar">
        <div class="notes-sidebar-head">
          <span class="notes-sidebar-title">Notes</span>
          <button class="btn" style="padding:4px 8px;font-size:12px;" onclick="newNote()">+ New</button>
        </div>
        <div class="notes-list" id="notes-list"></div>
      </div>
      <div class="note-editor">
        <div class="note-editor-head">
          <input class="note-editor-title" id="note-title" placeholder="Note title..." oninput="saveNote()"/>
        </div>
        <div class="md-toolbar">
          <button class="md-btn" onclick="insertMd('## ')">H2</button>
          <button class="md-btn" onclick="insertMd('**','**')"><b>B</b></button>
          <button class="md-btn" onclick="insertMd('*','*')"><i>I</i></button>
          <button class="md-btn" onclick="insertMd('`','`')">code</button>
          <button class="md-btn" onclick="insertMd('- ')">list</button>
        </div>
        <div class="note-editor-body">
          <div class="note-content" id="note-body" contenteditable="true" oninput="saveNote()" placeholder="Start writing..."></div>
        </div>
      </div>
    </div>
  </div>

  <!-- SHEETS VIEW -->
  <div class="view" id="view-sheets">
    <div class="sheets-layout">
      <div class="sheets-sidebar">
        <div class="sheets-sidebar-head">
          <span class="notes-sidebar-title" style="color:var(--text3);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;">Sheets</span>
          <button class="btn" style="padding:4px 8px;font-size:12px;" onclick="newSheet()">+ New</button>
        </div>
        <div class="sheets-list" id="sheets-list"></div>
      </div>
      <div class="sheet-main">
        <div class="sheet-toolbar">
          <input class="sheet-name-input" id="sheet-name" value="Budget tracker" oninput="saveSheetName()"/>
          <button class="btn" onclick="addSheetRow()">+ Row</button>
          <button class="btn" onclick="addSheetCol()">+ Col</button>
        </div>
        <div class="sheet-wrap">
          <table class="grid-table" id="grid-table"></table>
        </div>
      </div>
    </div>
  </div>

</div>

<!-- ADD TASK MODAL -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-title">New task</div>
    <div class="field"><label>Title</label><input id="m-title" placeholder="What needs to be done?" /></div>
    <div class="field"><label>Priority</label>
      <select id="m-priority"><option value="high">High</option><option value="med" selected>Medium</option><option value="low">Low</option></select>
    </div>
    <div class="field"><label>Due date</label><input id="m-due" type="date" /></div>
    <div class="field"><label>Time estimate (min)</label><input id="m-est" type="number" placeholder="30" /></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn primary" onclick="createTask()">Create task</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── DATA ──────────────────────────────────────────────────
let tasks = [
  { id:1, title:'Set up FastAPI project', priority:'high', due:'Today', col:'todo', est:60, spent:1320, running:false },
  { id:2, title:'Design PostgreSQL schema', priority:'high', due:'Today', col:'todo', est:45, spent:0, running:false },
  { id:3, title:'Build task CRUD endpoints', priority:'med', due:'Tomorrow', col:'todo', est:120, spent:0, running:false },
  { id:4, title:'Create React + Vite project', priority:'med', due:'May 22', col:'inprogress', est:30, spent:1080, running:false },
  { id:5, title:'Install Tailwind CSS', priority:'low', due:'May 22', col:'inprogress', est:20, spent:1200, running:false },
  { id:6, title:'Plan project architecture', priority:'high', due:'May 17', col:'done', est:30, spent:1680, running:false },
  { id:7, title:'Set up GitHub repository', priority:'med', due:'May 17', col:'done', est:15, spent:900, running:false },
];

let notes = [
  { id:1, title:'Project ideas', body:'<h2>Backend notes</h2><p>Use <code>SQLAlchemy</code> for ORM. Keep models clean and separate from schemas.</p><ul><li>FastAPI router per feature</li><li>JWT middleware in one place</li><li>Pydantic for all validation</li></ul>' },
  { id:2, title:'API design decisions', body:'<h2>Why PostgreSQL over MySQL</h2><p>Better free cloud tiers on Neon and Railway. JSON support is superior. Industry standard for most startups.</p>' },
  { id:3, title:'Deployment checklist', body:'<p>Steps before going live:</p><ul><li>Set environment variables on Railway</li><li>Connect Neon database string</li><li>Push to GitHub — Vercel auto-deploys</li></ul>' },
];

let sheets = [
  { id:1, name:'Budget tracker', cols:['Category','Jan','Feb','Mar','Total'], rows:[['Rent','15000','15000','15000','45000'],['Food','3000','2800','3200','9000'],['Utilities','800','750','820','2370'],['Transport','1200','1100','1300','3600'],['Savings','5000','5000','5000','15000'],['','','','','']] },
  { id:2, name:'Job applications', cols:['Company','Role','Status','Date','Notes'], rows:[['Startup A','Backend Dev','Applied','May 10','FastAPI role'],['Corp B','Python Dev','Interview','May 12','Good culture'],['Agency C','Fullstack','Rejected','May 8',''],['Scaleup D','API Dev','Pending','May 14',''],['','','','','']] },
];

let activeNote = 1;
let activeSheet = 1;
let timers = {};
let nextId = 20;

// ── UTILS ─────────────────────────────────────────────────
function fmt(sec) {
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
  if (h > 0) return h+'h '+m+'m';
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}
function today() { return new Date().toLocaleDateString('en-US',{month:'short',day:'numeric'}); }

// ── VIEWS ─────────────────────────────────────────────────
const titles = { kanban:'Kanban', today:'Today', alltasks:'All tasks', notes:'Notes', sheets:'Sheets' };
const actions = {
  kanban: `<button class="btn primary" onclick="openModal()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="14" height="14"><path d="M12 5v14M5 12h14"/></svg> New task</button>`,
  today: '',
  alltasks: `<button class="btn primary" onclick="openModal()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="14" height="14"><path d="M12 5v14M5 12h14"/></svg> New task</button>`,
  notes: `<button class="btn primary" onclick="newNote()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="14" height="14"><path d="M12 5v14M5 12h14"/></svg> New note</button>`,
  sheets: `<button class="btn primary" onclick="newSheet()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="14" height="14"><path d="M12 5v14M5 12h14"/></svg> New sheet</button>`,
};

function switchView(v) {
  document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
  document.getElementById('view-'+v).classList.add('active');
  document.querySelectorAll('.nav-btn')[['kanban','today','alltasks','notes','sheets'].indexOf(v)].classList.add('active');
  document.getElementById('page-title').textContent = titles[v];
  document.getElementById('topbar-actions').innerHTML = actions[v];
  if (v === 'today') renderToday();
  if (v === 'alltasks') renderAllTasks();
  if (v === 'notes') renderNotesList();
  if (v === 'sheets') { renderSheetsList(); renderSheet(activeSheet); }
}

// ── KANBAN ────────────────────────────────────────────────
const cols = [
  { id:'todo', label:'To do', color:'#5a5a6a' },
  { id:'inprogress', label:'In progress', color:'#4ea8de' },
  { id:'done', label:'Done', color:'#3ecf8e' },
];

function renderKanban() {
  const board = document.getElementById('kanban-board');
  board.innerHTML = '';
  cols.forEach(col => {
    const colTasks = tasks.filter(t => t.col === col.id);
    const div = document.createElement('div');
    div.className = 'col';
    div.innerHTML = `<div class="col-head">
      <div class="col-label"><div class="col-dot" style="background:${col.color}"></div>${col.label}</div>
      <span class="col-count">${colTasks.length}</span>
    </div>`;
    if (!colTasks.length) {
      div.innerHTML += `<div class="empty-col">No tasks here</div>`;
    }
    colTasks.forEach(task => {
      const pct = task.est > 0 ? Math.min(100, Math.round(task.spent / (task.est*60) * 100)) : 0;
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-title">${task.title}</div>
        <div class="card-meta">
          <span class="badge ${task.priority}">${task.priority}</span>
          <span class="due"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>${task.due}</span>
        </div>
        <div class="progress-wrap"><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div></div>
        <div class="timer-row">
          <span class="timer-val" id="tv-${task.id}">${fmt(task.spent)}</span>
          ${col.id !== 'done' ? `<div class="timer-play${task.running?' running':''}" id="tb-${task.id}" onclick="toggleTimer(${task.id})">
            ${task.running
              ? `<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>`
              : `<svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>`}
          </div>` : `<svg viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="2.5" width="16" height="16"><polyline points="20 6 9 17 4 12"/></svg>`}
        </div>`;
      div.appendChild(card);
    });
    board.appendChild(div);
  });
}

function toggleTimer(id) {
  const task = tasks.find(t => t.id === id);
  if (!task) return;
  if (task.running) {
    clearInterval(timers[id]); delete timers[id]; task.running = false;
  } else {
    tasks.forEach(t => { if (t.running) { clearInterval(timers[t.id]); delete timers[t.id]; t.running = false; } });
    task.running = true;
    timers[id] = setInterval(() => {
      task.spent++;
      const tv = document.getElementById('tv-'+id);
      if (tv) tv.textContent = fmt(task.spent);
      const pct = task.est > 0 ? Math.min(100, Math.round(task.spent/(task.est*60)*100)) : 0;
      const card = tv?.closest('.card');
      if (card) card.querySelector('.progress-fill').style.width = pct+'%';
    }, 1000);
  }
  renderKanban();
}

// ── TODAY ─────────────────────────────────────────────────
function renderToday() {
  const todayTasks = tasks.filter(t => t.due === 'Today');
  const doneTasks = todayTasks.filter(t => t.col === 'done');
  const totalSecs = tasks.reduce((a,t) => a+t.spent, 0);
  document.getElementById('stat-total').textContent = todayTasks.length;
  document.getElementById('stat-done').textContent = doneTasks.length;
  const h = Math.floor(totalSecs/3600), m = Math.floor((totalSecs%3600)/60);
  document.getElementById('stat-time').textContent = h+'h '+m+'m';
  const list = document.getElementById('today-list');
  list.innerHTML = '';
  todayTasks.forEach(task => {
    const done = task.col === 'done';
    const div = document.createElement('div');
    div.className = 'today-task';
    div.innerHTML = `
      <div class="today-task-check ${done?'checked':''}" onclick="toggleDone(${task.id})">
        ${done ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" width="10" height="10"><polyline points="20 6 9 17 4 12"/></svg>` : ''}
      </div>
      <span class="today-task-title${done?' done-t':''}">${task.title}</span>
      <span class="badge ${task.priority}">${task.priority}</span>
      <span class="today-task-time">${fmt(task.spent)}</span>`;
    list.appendChild(div);
  });
  if (!todayTasks.length) list.innerHTML = `<div style="color:var(--text3);font-size:13px;padding:20px 0;text-align:center;">No tasks due today</div>`;
}

function toggleDone(id) {
  const t = tasks.find(t => t.id === id);
  if (t) { t.col = t.col === 'done' ? 'todo' : 'done'; renderToday(); }
}

// ── ALL TASKS ─────────────────────────────────────────────
function renderAllTasks() {
  const tbody = document.getElementById('tasks-tbody');
  tbody.innerHTML = '';
  tasks.forEach(t => {
    const statusMap = { todo:'To do', inprogress:'In progress', done:'Done' };
    const statusClass = { todo:'status-todo', inprogress:'status-inprog', done:'status-done' };
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${t.title}</td>
      <td><span class="badge ${t.priority}">${t.priority}</span></td>
      <td><span class="status-pill ${statusClass[t.col]}">${statusMap[t.col]}</span></td>
      <td>${t.due}</td>
      <td>${t.est}m</td>
      <td style="font-family:'DM Mono',monospace;font-size:12px;">${fmt(t.spent)}</td>`;
    tbody.appendChild(tr);
  });
}

// ── NOTES ─────────────────────────────────────────────────
function renderNotesList() {
  const list = document.getElementById('notes-list');
  list.innerHTML = '';
  notes.forEach(n => {
    const div = document.createElement('div');
    div.className = 'note-item' + (n.id === activeNote ? ' active' : '');
    div.innerHTML = `<div class="note-item-title">${n.title}</div><div class="note-item-date">Edited today</div>`;
    div.onclick = () => { activeNote = n.id; renderNotesList(); loadNote(n.id); };
    list.appendChild(div);
  });
  loadNote(activeNote);
}

function loadNote(id) {
  const n = notes.find(n => n.id === id);
  if (!n) return;
  document.getElementById('note-title').value = n.title;
  document.getElementById('note-body').innerHTML = n.body;
}

function saveNote() {
  const n = notes.find(n => n.id === activeNote);
  if (!n) return;
  n.title = document.getElementById('note-title').value;
  n.body = document.getElementById('note-body').innerHTML;
  document.querySelectorAll('.note-item').forEach((el,i) => {
    if (notes[i]) el.querySelector('.note-item-title').textContent = notes[i].title;
  });
}

function newNote() {
  const n = { id: nextId++, title: 'Untitled note', body: '<p>Start writing...</p>' };
  notes.unshift(n); activeNote = n.id;
  renderNotesList(); toast('Note created');
}

function insertMd(before, after='') {
  const el = document.getElementById('note-body');
  el.focus();
  document.execCommand('insertText', false, before + (after ? 'text' + after : ''));
}

// ── SHEETS ────────────────────────────────────────────────
function renderSheetsList() {
  const list = document.getElementById('sheets-list');
  list.innerHTML = '';
  sheets.forEach(s => {
    const div = document.createElement('div');
    div.className = 'sheet-item' + (s.id === activeSheet ? ' active' : '');
    div.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg><span class="sheet-item-name">${s.name}</span>`;
    div.onclick = () => { activeSheet = s.id; renderSheetsList(); renderSheet(s.id); };
    list.appendChild(div);
  });
}

function renderSheet(id) {
  const s = sheets.find(s => s.id === id);
  if (!s) return;
  document.getElementById('sheet-name').value = s.name;
  const table = document.getElementById('grid-table');
  table.innerHTML = '';
  const thead = document.createElement('thead');
  const hrow = document.createElement('tr');
  hrow.innerHTML = '<th>#</th>' + s.cols.map(c => `<th><input style="background:none;border:none;outline:none;font-size:11px;color:var(--text2);font-weight:500;text-align:center;width:100%;font-family:'DM Sans',sans-serif;" value="${c}" onchange="updateCol(${id},${s.cols.indexOf(c)},this.value)"/></th>`).join('');
  thead.appendChild(hrow); table.appendChild(thead);
  const tbody = document.createElement('tbody');
  s.rows.forEach((row, ri) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${ri+1}</td>` + s.cols.map((_,ci) => `<td><input class="cell-input" value="${row[ci]||''}" onchange="updateCell(${id},${ri},${ci},this.value)"/></td>`).join('');
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
}

function updateCell(sid, ri, ci, val) {
  const s = sheets.find(s => s.id === sid);
  if (s) s.rows[ri][ci] = val;
}
function updateCol(sid, ci, val) {
  const s = sheets.find(s => s.id === sid);
  if (s) s.cols[ci] = val;
}
function saveSheetName() {
  const s = sheets.find(s => s.id === activeSheet);
  if (s) { s.name = document.getElementById('sheet-name').value; renderSheetsList(); }
}
function addSheetRow() {
  const s = sheets.find(s => s.id === activeSheet);
  if (s) { s.rows.push(new Array(s.cols.length).fill('')); renderSheet(activeSheet); }
}
function addSheetCol() {
  const s = sheets.find(s => s.id === activeSheet);
  if (s) { s.cols.push('Column'); s.rows.forEach(r => r.push('')); renderSheet(activeSheet); }
}
function newSheet() {
  const s = { id: nextId++, name: 'New sheet', cols: ['A','B','C','D','E'], rows: Array(6).fill(null).map(() => Array(5).fill('')) };
  sheets.unshift(s); activeSheet = s.id;
  renderSheetsList(); renderSheet(s.id); toast('Sheet created');
}

// ── MODAL ─────────────────────────────────────────────────
function openModal() {
  document.getElementById('modal').classList.add('open');
  document.getElementById('m-title').focus();
}
function closeModal() { document.getElementById('modal').classList.remove('open'); }
function createTask() {
  const title = document.getElementById('m-title').value.trim();
  if (!title) return;
  tasks.unshift({ id: nextId++, title, priority: document.getElementById('m-priority').value, due: 'Today', col: 'todo', est: parseInt(document.getElementById('m-est').value)||30, spent: 0, running: false });
  closeModal();
  document.getElementById('m-title').value = '';
  renderKanban(); toast('Task created');
}
document.getElementById('modal').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// ── INIT ──────────────────────────────────────────────────
renderKanban();
</script>
</body>
</html>
